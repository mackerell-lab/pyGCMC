name: Drude Production Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  validate-drude:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        openmm-version: ['8.1', '8.2']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        # Install conda
        wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
        bash miniconda.sh -b -p $HOME/miniconda
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate base
        
        # Create environment with specific Python version
        conda create -n test python=${{ matrix.python-version }} -y
        conda activate test
        
        # Install OpenMM specific version
        conda install -c conda-forge openmm=${{ matrix.openmm-version }} -y
        
        # Install other dependencies
        pip install numpy scipy matplotlib
    
    - name: Build PyGCMC
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)
    
    - name: Run production validation
      id: validate-production
      continue-on-error: true
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        cd build
        make validate-drude-production
    
    - name: Run CHARMM validation
      id: validate-charmm
      continue-on-error: true
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        cd build
        make validate-charmm
    
    - name: Run many-body validation
      id: validate-manybody
      continue-on-error: true
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        cd build
        make validate-drude-manybody
    
    - name: Performance benchmark
      id: performance
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        cd build
        make test-drude-performance > performance.log
        
        # Extract performance metrics
        grep "10 dipoles" performance.log | awk '{print "PERF_10_DIPOLES="$3}' >> $GITHUB_ENV
        grep "20 dipoles" performance.log | awk '{print "PERF_20_DIPOLES="$3}' >> $GITHUB_ENV
    
    - name: Check performance regression
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        # Compare with baseline (stored in repository)
        baseline_10=100  # calc/s
        baseline_20=30   # calc/s
        
        # Check for 10% regression
        python -c "
        import sys
        perf_10 = float('${{ env.PERF_10_DIPOLES }}')
        perf_20 = float('${{ env.PERF_20_DIPOLES }}')
        
        if perf_10 < ${baseline_10} * 0.9:
            print(f'❌ Performance regression: 10 dipoles {perf_10:.1f} < {${baseline_10}*0.9:.1f} calc/s')
            sys.exit(1)
        
        if perf_20 < ${baseline_20} * 0.9:
            print(f'❌ Performance regression: 20 dipoles {perf_20:.1f} < {${baseline_20}*0.9:.1f} calc/s')
            sys.exit(1)
        
        print(f'✅ Performance OK: 10 dipoles={perf_10:.1f}, 20 dipoles={perf_20:.1f} calc/s')
        "
    
    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-reports-${{ matrix.python-version }}-openmm${{ matrix.openmm-version }}
        path: |
          tmp/drude_production_report.json
          tmp/charmm_validation_report.json
          tmp/manybody_validation_report.json
          build/performance.log
    
    - name: Generate error histogram
      if: always()
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        python -c "
        import json
        import matplotlib.pyplot as plt
        import numpy as np
        
        # Load reports
        try:
            with open('tmp/drude_production_report.json') as f:
                prod_data = json.load(f)
            
            errors = [r['error'] for r in prod_data['results']]
            
            # Create histogram
            plt.figure(figsize=(10, 6))
            plt.hist(errors, bins=20, edgecolor='black', alpha=0.7)
            plt.xlabel('Error (%)')
            plt.ylabel('Count')
            plt.title('Drude Validation Error Distribution')
            plt.axvline(x=2.0, color='r', linestyle='--', label='2% threshold')
            plt.axvline(x=5.0, color='orange', linestyle='--', label='5% threshold')
            plt.legend()
            plt.grid(True, alpha=0.3)
            plt.savefig('error_histogram.png', dpi=150, bbox_inches='tight')
            print('✅ Error histogram generated')
        except Exception as e:
            print(f'⚠️  Could not generate histogram: {e}')
        "
    
    - name: Upload error histogram
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: error-histogram-${{ matrix.python-version }}-openmm${{ matrix.openmm-version }}
        path: error_histogram.png
    
    - name: Update validation status
      if: always()
      run: |
        source "$HOME/miniconda/etc/profile.d/conda.sh"
        conda activate test
        # Update status document
        python -c "
        import json
        from datetime import datetime
        
        status = {
            'last_run': datetime.now().isoformat(),
            'python_version': '${{ matrix.python-version }}',
            'openmm_version': '${{ matrix.openmm-version }}',
            'production_passed': '${{ steps.validate-production.outcome }}' == 'success',
            'charmm_passed': '${{ steps.validate-charmm.outcome }}' == 'success',
            'manybody_passed': '${{ steps.validate-manybody.outcome }}' == 'success',
            'performance': {
                '10_dipoles': float('${{ env.PERF_10_DIPOLES }}') if '${{ env.PERF_10_DIPOLES }}' else 0,
                '20_dipoles': float('${{ env.PERF_20_DIPOLES }}') if '${{ env.PERF_20_DIPOLES }}' else 0
            }
        }
        
        with open('validation_status.json', 'w') as f:
            json.dump(status, f, indent=2)
        "
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('validation_status.json', 'utf8'));
          
          const comment = `## Drude Validation Results
          
          | Test | Status |
          |------|--------|
          | Production | ${status.production_passed ? '✅' : '❌'} |
          | CHARMM | ${status.charmm_passed ? '✅' : '❌'} |
          | Many-body | ${status.manybody_passed ? '✅' : '❌'} |
          
          **Performance:**
          - 10 dipoles: ${status.performance['10_dipoles'].toFixed(1)} calc/s
          - 20 dipoles: ${status.performance['20_dipoles'].toFixed(1)} calc/s
          
          Python ${status.python_version} | OpenMM ${status.openmm_version}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Final validation check
      if: always()
      run: |
        # Fail the job if any validation failed
        if [[ "${{ steps.validate-production.outcome }}" != "success" ]] || \
           [[ "${{ steps.validate-charmm.outcome }}" != "success" ]] || \
           [[ "${{ steps.validate-manybody.outcome }}" != "success" ]]; then
          echo "❌ Validation failed"
          exit 1
        fi
        echo "✅ All validations passed"